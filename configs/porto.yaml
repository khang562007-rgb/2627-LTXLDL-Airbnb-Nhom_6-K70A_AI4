# Unified configuration for the three Porto data workflows.
# Paths that differed between branches are kept under their workflow sections.
city: porto
data_root: portugal/norte/porto
currency: EUR
snapshots:
  - "2025-09-21"
  - "2026-03-26"
  - "2026-06-23"
  - "2026-09-19"
seed: 42
expected_days: 365

paths:
  raw_root: data/raw
  interim: data/interim # filtered, not flagged
  processed: data/processed # flagged, final outputs
  sample_root: data/samples

sample:
  data_code: DSE2049-C04-G06-porto
  calendar_cols: [listing_id, date, available]
  reviews:
    ids_path: data/samples/review_ids.csv
    ids_url: "https://docs.google.com/spreadsheets/d/1Ru6653xzX4r29ywxoGSGA543F3QjXwQaVgC19WTwNEA/export?format=csv&gid=0"
  listings:
    ids_path: data/samples/porto-listings.csv
    ids_url: "https://docs.google.com/spreadsheets/d/1wzH-Wy22LIeR2qaLpP5lDmkSn48gRqRjVrp2q3z69v8/export?format=csv&gid=0"
  listing_ids_path: data/samples/id_listing.csv

qa:
  reviews:
    min_comment_len: 3
    dup_content_keys: [listing_id, reviewer_id, date, comments]
    max_days_before_host_since: 30
    score_min: 0
    score_max: 5
  property:
    room_types: [Entire home/apt, Private room, Shared room, Hotel room]
    property_type_min_share: 0.005
    capacity_max: 16
    attr_cols: [room_type, property_type, bedrooms]
    coord_drift_m: 200

calendar:
  raw_file: "data/raw/{snap}/calendar.csv.gz"
  # Filtered calendar consumed by the flagging workflow.
  interim_file: "data/interim/calendar_{snap}.csv"
  flagged_file: "data/processed/calendar_{snap}.csv"
  required_columns: [listing_id, date, available]
  availability_min: 0
  availability_max: 365

listings:
  raw_file: "data/raw/{snap}/listings.csv.gz"

download:
  base_url: "https://data.insideairbnb.com/portugal/norte/porto"
  files: [listings.csv.gz, calendar.csv.gz, reviews.csv.gz]
  stream_chunk_size: 1048576
  timeout_seconds: 60

  cleaning:
  price_iqr_k: 2
  min_nights_cap: 365
  max_nights_cap: 1125
  long_stay_threshold: 30
  price_jump_ratio: 2

# Compatibility map for consumers that still use the branch-specific names.
# Select the relevant workflow section rather than relying on conflicting flat keys.
workflows:
  sample_and_qa:
    raw_root: ".."
    interim_dir: data/interim
    processed_dir: data/processed
  snapshot_pipeline:
    raw_root: data/raw
    listing_ids: data/samples/id_listing.csv
    calendar_raw: "data/raw/{snap}/calendar.csv.gz"
    calendar_filtered: "data/processed/calendar_{snap}.csv"
    listings_raw: "data/raw/{snap}/listings.csv.gz"
availability_commercial: 240
tourist_tax_per_night: 3          # EUR/khách/đêm, nguồn: cổng thuế du lịch Porto
tourist_tax_guests: 2             # giả định số khách mỗi đêm (hoặc dùng accommodates)
tourist_tax_max_nights: 7         # trần đêm liên tiếp mỗi lượt
kpi_commercial_share:
  id: K06
  slug: commercial_share
k05_revenue_tax:
  id: K05
  slug: revenue_tax
  review_rate: 0.5
  average_stay_nights: 3
  sensitivity_average_stay: [2, 3, 5]
  occupancy_cap: 0.70
  max_nights_per_year: 365
  use_iqr_fence: true
  iqr_k: 1.5
  tourist_tax_per_night:
    short_stay: 3
    long_stay: 3
  license_exempt_values: ["exempt"]
baseline:
  # Ưu tiên langdetect; dùng bộ từ dừng dự phòng nếu môi trường chưa cài gói này.
  lang_backend: auto
  min_lang_confidence: 0.5
  short_max_tokens: 3
  short_min_lang_confidence: 0.1
